name: Sync Atlas with OpenClaw stable
run-name: "Atlas sync ${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: Official stable version shown in Atlas
        required: true
        type: string

concurrency:
  group: atlas-sync-stable-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare pull request
    if: github.repository == 'maplel/openclaw' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.candidate.outputs.head }}
      base: ${{ steps.candidate.outputs.base }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble candidate
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          git fetch --no-tags https://github.com/openclaw/openclaw.git "refs/tags/$tag"
          upstream="$(git rev-parse 'FETCH_HEAD^{commit}')"
          base="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo 'Atlas already contains this official release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -c core.hooksPath=/dev/null merge --no-ff --no-commit "$upstream"; then
            if test -n "$(git diff --name-only --diff-filter=U)"; then
              {
                echo "Merge conflicts with $tag:"
                echo '~~~'
                git -c core.quotePath=true diff --name-only --diff-filter=U
                echo '~~~'
              } >> "$GITHUB_STEP_SUMMARY"
              echo 'conflict=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          git -c core.hooksPath=/dev/null commit -m "chore(atlas): sync OpenClaw $tag"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Report merge conflict
        if: steps.candidate.outputs.conflict == 'true'
        run: |
          echo '::error::Git reported merge conflicts. See the workflow summary for affected files.'
          exit 1
      - name: Open pull request
        if: steps.candidate.outputs.head != ''
        id: pr
        env:
          GH_TOKEN: ${{ secrets.ATLAS_SYNC_REPOSITORY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="atlas-sync/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh auth setup-git --hostname github.com
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$branch"
          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(atlas): sync OpenClaw v$VERSION" \
            --body "Official stable sync. Verification: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          number="${url##*/}"
          [[ "$number" =~ ^[0-9]+$ ]]
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "[Pull request #$number]($url)" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify candidate
    needs: prepare
    if: needs.prepare.outputs.head != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify Atlas patches
        run: |
          node -e 'const s = require("./package.json").openclaw?.atlasUpdateSource; if (s?.repositoryUrl !== "https://github.com/maplel/openclaw" || s.branch !== "main") process.exit(1)'
          pnpm test src/agents/tool-schema-hints.test.ts src/infra/atlas-official-release.test.ts src/infra/atlas-update-discovery.test.ts src/infra/atlas-update-source.test.ts ui/src/pages/config/updates-atlas.test.ts
      - name: Build Atlas
        run: pnpm build:ci-artifacts

  land:
    name: Merge pull request
    needs: [prepare, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge verified PR into main
        env:
          GH_TOKEN: ${{ secrets.ATLAS_SYNC_REPOSITORY_TOKEN }}
          PR: ${{ needs.prepare.outputs.pr }}
          BASE: ${{ needs.prepare.outputs.base }}
          HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$BASE" ]]; then
            echo '::error::Atlas main moved during verification. Run sync again against the new main.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" --method PUT \
            -f sha="$HEAD" -f merge_method=merge | jq -e '.merged == true'
